<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Müller Donau Zentrum — Монтаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17181a;
    --card: #211f1c;
    --card-2: #29271f;
    --line: #3a372f;
    --text: #f2ede2;
    --text-dim: #a9a396;
    --tape: #f2b705;
    --zoneA: #e8a33d;
    --zoneB: #3e8e7e;
    --zoneC: #c1502e;
    --zoneD: #6b6fa8;
    --done: #6fae5f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  body{ padding-bottom:48px; }

  .hazard{
    height:8px;
    background: repeating-linear-gradient(45deg, var(--tape), var(--tape) 10px, #1a1a1a 10px, #1a1a1a 20px);
  }

  header{ padding:22px 18px 16px; border-bottom:1px solid var(--line); }
  .eyebrow{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.04em; color:var(--text-dim); margin:0 0 2px; }
  h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:22px; line-height:1.15; margin:0 0 14px; }

  .overall{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .overall-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .overall-top .label{ font-size:13px; color:var(--text-dim); }
  .overall-top .num{ font-family:'Oswald',sans-serif; font-size:26px; font-weight:600; }
  .bar{ height:14px; border-radius:7px; background:#38352c; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--tape); transition:width .35s ease; }

  .nameRow{ display:flex; gap:8px; margin-top:12px; align-items:center; }
  .nameRow input{
    flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:9px 10px; border-radius:8px; font-size:14px; font-family:'Inter',sans-serif;
  }
  .nameRow input::placeholder{ color:var(--text-dim); }
  .nameRow .tag{ font-size:12px; color:var(--text-dim); white-space:nowrap; }

  /* legend */
  .legend{ display:flex; flex-wrap:wrap; gap:8px; padding:14px 18px 0; }
  .legend-item{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);
    background:var(--card); border:1px solid var(--line); border-radius:20px; padding:5px 10px 5px 8px;
  }
  .legend-dot{ width:10px; height:10px; border-radius:50%; flex:none; }

  .toolbar{ display:flex; gap:8px; padding:12px 18px 0; }
  .filter-btn{
    flex:1; background:var(--card); border:1px solid var(--line); color:var(--text-dim);
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    padding:9px 10px; border-radius:8px; cursor:pointer; text-align:center;
  }
  .filter-btn.active{ background:var(--tape); color:#1a1a1a; border-color:var(--tape); }

  main{ padding:16px 14px 8px; }

  .zone{ margin-bottom:18px; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  .zone-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; cursor:pointer; user-select:none;
  }
  .zone-head-left{ display:flex; align-items:center; gap:10px; }
  .zone-dot{ width:12px; height:12px; border-radius:50%; flex:none; }
  .zone-title{ font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; }
  .zone-count{ font-size:13px; color:var(--text-dim); }
  .zone-chevron{ font-size:13px; color:var(--text-dim); transition:transform .2s ease; }
  .zone.collapsed .zone-chevron{ transform:rotate(-90deg); }

  .zone-progress{ height:4px; background:#38352c; }
  .zone-progress-fill{ height:100%; transition:width .35s ease; }

  .zone-body{ }
  .zone.collapsed .zone-body{ display:none; }

  .zone-map-strip{ padding:10px 12px 2px; }
  .zone-map-strip img{
    width:100%; display:block; border-radius:8px; border:1px solid var(--line);
  }
  .zone-map-caption{ font-size:11px; color:var(--text-dim); margin:6px 2px 4px; }

  .item{
    display:flex; align-items:flex-start; gap:10px;
    padding:13px 14px; border-top:1px solid var(--line);
  }
  .item:first-child{ border-top:none; }
  .check{
    flex:none; width:26px; height:26px; margin-top:1px; border-radius:7px;
    border:2px solid var(--line); background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700; color:transparent;
  }
  .item.done .check{ background:var(--done); border-color:var(--done); color:#0f1a0d; }
  .item-main{ flex:1; min-width:0; }
  .item-label{ font-size:14.5px; line-height:1.35; }
  .item.done .item-label{ color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--line); }
  .item-meta{ font-size:11.5px; color:var(--text-dim); margin-top:3px; min-height:14px; }
  .item-note{ font-size:12px; color:#dcbf7a; margin-top:4px; }
  .item-actions{ flex:none; display:flex; flex-direction:column; gap:6px; }
  .pin-btn, .note-btn{
    background:var(--bg); border:1px solid var(--line); color:var(--text-dim);
    font-size:13px; line-height:1; padding:6px 8px; border-radius:7px; cursor:pointer;
  }

  .refresh-wrap{ padding:6px 14px 20px; text-align:center; }
  .refresh{
    background:var(--card-2); border:1px solid var(--line); color:var(--text);
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    padding:10px 18px; border-radius:20px; cursor:pointer;
  }
  .refresh:active{ background:var(--line); }
  .status-line{ text-align:center; font-size:11.5px; color:var(--text-dim); margin-top:8px; }

  .footer-note{ padding:0 22px 20px; text-align:center; font-size:11.5px; color:var(--text-dim); line-height:1.5; }

  /* modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.82); display:none;
    align-items:center; justify-content:center; padding:18px; z-index:50;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-box{ max-width:520px; width:100%; }
  .modal-box img{ width:100%; border-radius:10px; display:block; }
  .modal-caption{ color:var(--text); font-size:13px; text-align:center; margin-top:12px; }
  .modal-close{
    margin:14px auto 0; display:block; background:var(--card); border:1px solid var(--line);
    color:var(--text); font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    padding:9px 20px; border-radius:20px; cursor:pointer;
  }
</style>
</head>
<body>

<div class="hazard"></div>
<header>
  <p class="eyebrow">Проект P-001621</p>
  <h1>Müller — Donau Zentrum, монтаж меблів</h1>
  <div class="overall">
    <div class="overall-top">
      <span class="label">Загальний прогрес</span>
      <span class="num" id="overallNum">0%</span>
    </div>
    <div class="bar"><div class="bar-fill" id="overallBar" style="width:0%"></div></div>
    <div class="nameRow">
      <span class="tag">Моє ім'я:</span>
      <input id="nameInput" type="text" placeholder="напр. Іван" maxlength="24">
    </div>
  </div>
</header>

<div class="legend" id="legend"></div>

<div class="toolbar">
  <button class="filter-btn active" id="filterAll">Усі пункти</button>
  <button class="filter-btn" id="filterOpen">Лише незавершені</button>
</div>

<main id="zonesContainer"></main>

<div class="refresh-wrap">
  <button class="refresh" id="refreshBtn">Оновити з сервера</button>
  <div class="status-line" id="statusLine">—</div>
</div>

<div class="footer-note">Дані спільні для всієї команди — відмітки й нотатки видно на всіх телефонах після оновлення. Мапи — орієнтовні зони, не координати окремих деталей.</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <img id="modalImg" src="" alt="Зона на плані">
    <div class="modal-caption" id="modalCaption"></div>
    <button class="modal-close" id="modalClose">Закрити</button>
  </div>
</div>

      'Вітрина Schaufenster — 6 секцій скла',
      'Монтаж каси',
      'Розетки / GST1&3 за легендою',
      'LAN підключення',
      'Фінальна перевірка з електриком'
    ]
  },
  {
    id: 'zoneD', name: 'Графіка', color: 'var(--zoneD)', colorHex: '#6b6fa8',
    items: [
      'Наклейки/панелі — стіни W1–W4',
      'Наклейки/панелі — стіни W5/W6',
      'Наклейки — вітрина',
      'Маркування полиць (серії A–L)'
    ]
  }
];

const STORAGE_KEY = 'muller-donau-checklist-v2';
const NAME_KEY = 'muller-donau-user-name';
const COLLAPSE_KEY = 'muller-donau-collapse-v2';

let state = {};
let collapsed = {};
let myName = '';
let filterMode = 'all';

function itemId(zoneId, idx){ return zoneId + '-' + idx; }

function buildLegend(){
  const legend = document.getElementById('legend');
  legend.innerHTML = ZONES.map(z => `
    <div class="legend-item">
      <span class="legend-dot" style="background:${z.colorHex}"></span>
      <span>${z.name}</span>
    </div>`).join('');
}

function buildDom(){
  const container = document.getElementById('zonesContainer');
  container.innerHTML = '';
  ZONES.forEach(zone => {
    const zoneEl = document.createElement('div');
    zoneEl.className = 'zone';
    zoneEl.id = 'wrap-' + zone.id;
    zoneEl.style.background = zone.colorHex + '14';
    if (collapsed[zone.id]) zoneEl.classList.add('collapsed');

    const head = document.createElement('div');
    head.className = 'zone-head';
    head.style.background = zone.colorHex + '22';
    head.innerHTML = `
      <div class="zone-head-left">
        <span class="zone-dot" style="background:${zone.colorHex}"></span>
        <span class="zone-title">${zone.name}</span>
      </div>
      <div class="zone-head-left">
        <span class="zone-count" id="count-${zone.id}">0/${zone.items.length}</span>
        <span class="zone-chevron">▾</span>
      </div>`;
    head.addEventListener('click', () => {
      collapsed[zone.id] = !collapsed[zone.id];
      zoneEl.classList.toggle('collapsed');
      localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed));
    });

    const zprog = document.createElement('div');
    zprog.className = 'zone-progress';
    zprog.innerHTML = `<div class="zone-progress-fill" id="zbar-${zone.id}" style="width:0%; background:${zone.colorHex}"></div>`;

    const mapStrip = document.createElement('div');
    mapStrip.className = 'zone-map-strip';
    mapStrip.innerHTML = `
      <img src="${ZONE_MAPS[zone.id]}" alt="Карта зони ${zone.name}" data-zone="${zone.id}">
      <div class="zone-map-caption">Орієнтовна ділянка на плані — торкніться, щоб збільшити</div>`;
    mapStrip.querySelector('img').addEventListener('click', () => openModal(zone.id, zone.name));

    const body = document.createElement('div');
    body.className = 'zone-body';
    body.appendChild(mapStrip);

    zone.items.forEach((label, idx) => {
      const id = itemId(zone.id, idx);
      const row = document.createElement('div');
      row.className = 'item';
      row.id = 'row-' + id;
      row.innerHTML = `
        <div class="check">✓</div>
        <div class="item-main">
          <div class="item-label">${label}</div>
          <div class="item-meta" id="meta-${id}"></div>
          <div class="item-note" id="note-${id}"></div>
        </div>
        <div class="item-actions">
          <button class="pin-btn" title="Показати на плані">📍</button>
          <button class="note-btn" title="Додати нотатку">🗒</button>
        </div>`;
      row.querySelector('.item-label').addEventListener('click', () => toggleItem(id));
      row.querySelector('.check').addEventListener('click', () => toggleItem(id));
      row.querySelector('.pin-btn').addEventListener('click', (e) => { e.stopPropagation(); openModal(zone.id, zone.name); });
      row.querySelector('.note-btn').addEventListener('click', (e) => { e.stopPropagation(); editNote(id); });
      body.appendChild(row);
    });

    zoneEl.appendChild(head);
    zoneEl.appendChild(zprog);
    zoneEl.appendChild(body);
    container.appendChild(zoneEl);
  });
  applyFilter();
}

function render(){
  let totalDone = 0, totalItems = 0;
  ZONES.forEach(zone => {
    let zoneDone = 0;
    zone.items.forEach((label, idx) => {
      const id = itemId(zone.id, idx);
      const entry = state[id];
      const row = document.getElementById('row-' + id);
      const meta = document.getElementById('meta-' + id);
      const noteEl = document.getElementById('note-' + id);
      const isDone = !!(entry && entry.done);
      row.classList.toggle('done', isDone);
      if (isDone){
        zoneDone++;
        meta.textContent = entry.by ? `✓ ${entry.by}` : '✓ відмічено';
      } else {
        meta.textContent = '';
      }
      if (entry && entry.note){
        noteEl.textContent = '🗒 ' + entry.note;
      } else {
        noteEl.textContent = '';
      }
    });
    totalDone += zoneDone;
    totalItems += zone.items.length;
    const pct = zone.items.length ? Math.round((zoneDone / zone.items.length) * 100) : 0;
    document.getElementById('count-' + zone.id).textContent = `${zoneDone}/${zone.items.length}`;
    document.getElementById('zbar-' + zone.id).style.width = pct + '%';
  });
  const overallPct = totalItems ? Math.round((totalDone / totalItems) * 100) : 0;
  document.getElementById('overallNum').textContent = overallPct + '%';
  document.getElementById('overallBar').style.width = overallPct + '%';
  applyFilter();
}

function applyFilter(){
  ZONES.forEach(zone => {
    zone.items.forEach((label, idx) => {
      const id = itemId(zone.id, idx);
      const row = document.getElementById('row-' + id);
      if (!row) return;
      const entry = state[id];
      const isDone = !!(entry && entry.done);
      row.style.display = (filterMode === 'open' && isDone) ? 'none' : 'flex';
    });
  });
}

async function loadState(){
  setStatus('Завантаження…');
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    state = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){
    state = {};
  }
  render();
  setStatus('Оновлено ' + nowLabel());
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
    setStatus('Збережено ' + nowLabel());
  }catch(e){
    setStatus('Помилка збереження — спробуйте ще раз');
  }
}

function toggleItem(id){
  const wasDone = !!(state[id] && state[id].done);
  const prevNote = state[id] && state[id].note;
  if (wasDone){
    state[id] = { done: false, note: prevNote };
  } else {
    state[id] = { done: true, by: myName || 'без імені', at: Date.now(), note: prevNote };
  }
  if (navigator.vibrate) navigator.vibrate(15);
  render();
  saveState();
}

function editNote(id){
  const current = (state[id] && state[id].note) || '';
  const text = prompt('Нотатка до пункту:', current);
  if (text === null) return;
  const wasDone = !!(state[id] && state[id].done);
  const by = state[id] && state[id].by;
  const at = state[id] && state[id].at;
  state[id] = { done: wasDone, by, at, note: text.trim() };
  render();
  saveState();
}

function openModal(zoneId, zoneName){
  document.getElementById('modalImg').src = ZONE_MAPS[zoneId];
  document.getElementById('modalCaption').textContent = zoneName + ' — орієнтовна ділянка';
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
}

function nowLabel(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function setStatus(text){
  document.getElementById('statusLine').textContent = text;
}

function initName(){
  myName = localStorage.getItem(NAME_KEY) || '';
  const input = document.getElementById('nameInput');
  input.value = myName;
  input.addEventListener('change', () => {
    myName = input.value.trim();
    localStorage.setItem(NAME_KEY, myName);
  });
}
function initCollapse(){
  try{ collapsed = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}'); }catch(e){ collapsed = {}; }
}

document.getElementById('refreshBtn').addEventListener('click', loadState);
document.getElementById('modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeModal(); });
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('filterAll').addEventListener('click', () => {
  filterMode = 'all';
  document.getElementById('filterAll').classList.add('active');
  document.getElementById('filterOpen').classList.remove('active');
  applyFilter();
});
document.getElementById('filterOpen').addEventListener('click', () => {
  filterMode = 'open';
  document.getElementById('filterOpen').classList.add('active');
  document.getElementById('filterAll').classList.remove('active');
  applyFilter();
});

initName();
initCollapse();
buildLegend();
buildDom();
loadState();
</script>

</body>
</html>
